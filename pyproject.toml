[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disco-search"
version = "0.1.0"
description = "Verifier-grounded evolutionary discovery -- an open, general FunSearch harness. Only certified-valid candidates ever survive."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satyawan Singh" }]
keywords = ["funsearch", "discovery", "evolutionary", "llm", "program-synthesis", "verifier", "combinatorics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/ss1738/disco"
Issues = "https://github.com/ss1738/disco/issues"

[tool.hatch.build.targets.wheel]
packages = ["disco"]

[tool.ruff]
line-length = 88
target-version = "py39"
